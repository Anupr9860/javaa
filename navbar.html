<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        aside{
            width: 200px; height: 100vh; background: blue; position: fixed; left: -200px; top:0; transition: 0.9s;
        }
        .open
        {
            left: 0;
        }
        .m{margin-left: 200px;} button{transition: 0.9s;}
    </style>
</head>
<body>
    <button onclick="abc()">menu</button>
    <aside></aside>
    <script>
        function abc() {
            document.querySelector('aside').classList.toggle('open')
             document.querySelector('button').classList.toggle('m')
        }
    </script>
</body>
</html>
